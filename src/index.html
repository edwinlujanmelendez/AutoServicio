<script type="text/javascript">
  function openForm() {
    VisanetCheckout.configure({
      sessiontoken: String($("#data_sessiontoken").val()),
      channel: String($("#data_channel").val()),
      merchantid: String($("#data_merchantid").val()),
      purchasenumber: Number($("#data_purchasenumber").val()),
      amount: Number($("#data_amount").val()),
      expirationminutes: String($("#data_expirationminutes").val()),
      timeouturl: String($("#data_timeouturl").val()),
      merchantlogo: String($("#data_merchantlogo").val()),
      formbuttoncolor: String($("#data_formbuttoncolor").val()),
      hidexbutton:'false',
      action: String($("#action").val()),
      complete: function(params) {
        alert(JSON.stringify(params));
      }
    });
    VisanetCheckout.open();
  }

  window.onload = function(){
    document.addEventListener("contextmenu", function(e){
      e.preventDefault();
    }, false);
  }
